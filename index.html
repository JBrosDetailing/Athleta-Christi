<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Athleta Christi</title>
<meta name="theme-color" content="#0a1c33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Athleta">
<meta name="application-name" content="Athleta">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  /* Archangel: Marian blue ground, gold leaf, the red of St Michael's cloak. Layout: one-screen app — fixed header, scrolling middle, bottom tab bar, bottom sheets */
  --bg:#0a1c33; --surface:#0f2644; --surface2:#163256; --line:#26476f;
  --ink:#f1e8d4; --muted:#b9ae95; --accent:#d4af50; --accent-ink:#1a1206; --red:#8a2e1b; --gold2:#b8892f;
  --good:#a8381f; --bad:#f08a6c;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:"Cinzel","Trajan Pro",Georgia,serif; --prayer:"Cormorant Garamond",Georgia,"Iowan Old Style",serif;
  --r:14px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);overscroll-behavior:none}
body{display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(120% 55% at 50% -12%,rgba(212,175,80,.13),transparent 62%),var(--bg);-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--display);text-wrap:balance}
.num,input{font-variant-numeric:tabular-nums}

header{padding:calc(var(--st) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;background:transparent;border-bottom:1px solid rgba(212,175,80,.28);flex:none}
header .mark{flex:none;display:block;filter:drop-shadow(0 0 6px rgba(212,175,80,.35))}
header h1{font-size:21px;font-weight:700;letter-spacing:.06em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.who{display:flex;align-items:center;gap:8px;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:5px 12px 5px 5px;border-radius:99px;background:var(--surface2);font-weight:600;font-size:15px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#0a1c33;flex:none;font-family:var(--display)}

main>*{flex-shrink:0}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 28px;display:flex;flex-direction:column;gap:14px}
nav{flex:none;display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);background:rgba(9,24,44,.97);padding-bottom:var(--sb);border-top-color:rgba(212,175,80,.28)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:10.5px;font-weight:600;color:var(--muted)}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.note{margin:0;color:var(--muted);font-size:14px}
.sec{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 2px -4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;background:var(--surface2);font-weight:650;min-height:46px}
.btn.pri{background:linear-gradient(180deg,#e2c167,#c79d3e);color:var(--accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.dang{background:transparent;color:var(--bad);border:1px solid #7a3b2c}
.btn.full{width:100%}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:10px}
.icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:20px}

.weekbar{display:flex;align-items:center;gap:8px}
.weekbar .mid{flex:1;text-align:center}
.weekbar .mid b{font-size:20px;font-family:var(--display);letter-spacing:.04em}
.weekbar .mid small{display:block;color:var(--accent);font-weight:650;font-size:13px}
.weekbar button{width:44px;height:44px;border-radius:12px;background:var(--surface2);font-size:22px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;flex-direction:column;align-items:flex-start;padding:9px 13px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted);max-width:180px;text-align:left;position:relative}
.chip span{font-size:14px;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:154px}
.chip.on{border-color:var(--accent);background:rgba(212,175,80,.13)}
.chip.on,.chip.on span{color:var(--accent)}
.chip .ok{position:absolute;top:6px;right:8px;font-size:12px;font-weight:900;color:var(--accent)}
.chip.did{border-color:var(--red)}
.chip .dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent)}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 10px}
.ex.complete{border-color:var(--red)}
.exh{display:flex;align-items:flex-start;gap:8px}
.exh h3{font-size:17px;font-weight:700;font-family:var(--font)}
.tgt{display:inline-block;margin-top:3px;font-size:13px;font-weight:650;color:var(--accent)}
.cue{margin:6px 0 0;font-size:13px;color:var(--muted)}
.last{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.last b{color:var(--ink);font-weight:600}
.sets{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.srow{display:grid;grid-template-columns:30px 1fr 1fr 46px;gap:8px;align-items:center}
.srow.nl{grid-template-columns:30px 1fr 46px}
.srow.head{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.srow.head span:not(:first-child){text-align:center}
.srow .n{text-align:center;font-weight:700;color:var(--muted)}
.srow input{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-size:17px;text-align:center;font-weight:650;padding:0 4px}
.srow input::placeholder{color:#7486a3;font-weight:500}
.tick{height:42px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);font-size:18px;font-weight:800}
.srow.done input{background:#3a1a14;border-color:var(--red)}
.srow.done .tick{background:var(--red);border-color:var(--accent);color:var(--accent)}
.exf{display:flex;justify-content:space-between;margin-top:8px}
.exf button{font-size:14px;font-weight:650;color:var(--accent);padding:6px 4px}

label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:650;color:var(--muted)}
.fi{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-size:16px;padding:10px 12px;font-family:inherit}
textarea.fi{min-height:80px;resize:vertical}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:14px;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 rgba(0,0,0,.4)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.tile b{display:block;font-size:26px;font-family:var(--display);font-weight:700;color:var(--accent)}
.tile span{font-size:12px;color:var(--muted);font-weight:600}
.hist{display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.date{width:46px;flex:none;text-align:center;border-radius:10px;background:var(--surface2);padding:6px 0}
.date b{display:block;font-size:19px;font-family:var(--display)}
.date small{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.hist h3{font-size:16px}
.list{display:flex;flex-direction:column;gap:10px}
.test{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.test .val{font-size:24px;font-weight:800;font-family:var(--display)}
.delta{font-size:13px;font-weight:700}
.delta.up{color:var(--accent)} .delta.down{color:var(--bad)}
.spark{grid-column:1/-1;width:100%;height:56px;display:block}
.pb{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.pb:first-child{border-top:0}

.ph{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.phh{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 14px;width:100%;text-align:left}
.phh h3{font-size:16px}
.day{border-top:1px solid var(--line);padding:10px 12px 12px 14px}
.dayh{display:flex;align-items:center;gap:8px;width:100%;text-align:left}
.dayh .wd{font-size:12px;font-weight:800;color:var(--accent);width:34px}
.dayh h4{margin:0;font-size:15px;flex:1}
.exl{display:flex;flex-direction:column;margin-top:6px;padding-left:42px}
.exl button{display:flex;gap:8px;text-align:left;padding:7px 0;font-size:14px;border-bottom:1px solid #1f3c60}
.exl button span:first-child{flex:1}
.exl button span:last-child{color:var(--muted);font-size:13px;text-align:right}
.add{color:var(--accent);font-weight:650;font-size:14px;padding:8px 0 0}

.banner{display:flex;gap:12px;align-items:center;background:rgba(212,175,80,.09);border:1px solid #6b5a2c;border-radius:var(--r);padding:12px}
.banner p{margin:0;font-size:14px;flex:1}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty h2{color:var(--ink);font-size:19px;margin-bottom:6px}

#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--line);padding:8px 16px calc(var(--sb) + 18px);transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:21;display:flex;flex-direction:column;gap:12px}
#sheet.on{transform:none}
#sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 4px;flex:none}
#sheet h2{font-size:20px;letter-spacing:.03em}
#sheet{border-top:1px solid rgba(212,175,80,.35)!important}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:12px;background:var(--surface2);text-align:left;font-weight:600}
.opt.on{outline:2px solid var(--accent)}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:13px}

#timer{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 70px);background:var(--surface2);border:1px solid #8a6a2a;border-radius:16px;padding:10px 10px 10px 16px;display:none;align-items:center;gap:10px;z-index:15;box-shadow:0 10px 30px rgba(0,0,0,.5);overflow:hidden}
#timer.on{display:flex}
body.timing main{padding-bottom:120px}
#timer .t{font-size:26px;font-weight:800;font-family:var(--display);font-variant-numeric:tabular-nums}
#timer .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
#timer.done{border-color:var(--accent);background:#3a1a14} #timer.done .t{color:var(--accent)}
#toast{position:fixed;left:50%;top:calc(var(--st) + 64px);transform:translate(-50%,-20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:30;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
button:active,.opt:active,.chip:active,.hist:active{transform:scale(.97);transition:transform .08s}
main.fade>*{animation:fade .2s ease-out}
@keyframes fade{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}
.prog{position:sticky;top:-14px;z-index:5;margin:-14px -16px 0;padding:10px 16px;background:rgba(14,17,22,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;font-size:13px;font-weight:700}
.prog .pbar{flex:1;height:6px;border-radius:9px;background:var(--surface2);overflow:hidden}
.prog .pbar i{display:block;height:100%;background:var(--good);transition:width .3s}
.prayer{background:linear-gradient(180deg,rgba(138,46,27,.55),rgba(15,38,68,.9) 70%);border:1px solid #8a6a2a;box-shadow:inset 0 0 0 1px rgba(212,175,80,.12);border-radius:var(--r);padding:16px}
.prayer h3{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.prayer p{margin:10px 0 14px;font-family:var(--prayer);font-size:19px;font-weight:500;line-height:1.6;white-space:pre-line;-webkit-user-select:text;user-select:text}
.prayer.done{display:flex;align-items:center;width:100%;text-align:left;padding:11px 14px}
.prayer.done h3{flex:1}
.cl{display:flex;flex-direction:column;margin-top:8px}
.cli{display:flex;gap:12px;align-items:center;width:100%;padding:10px 0;border-top:1px solid var(--line);text-align:left;font-size:15px}
.cli .box{width:24px;height:24px;flex:none;border-radius:7px;border:2px solid #4a6488;display:grid;place-items:center;font-weight:900;color:var(--accent);font-size:14px}
.cli.on .box{background:var(--red);border-color:var(--accent)}
.cli.on .sp{color:var(--muted);text-decoration:line-through}
.rest{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--ink);background:var(--surface2);border:1px solid var(--line);padding:3px 9px;border-radius:99px;margin-left:8px;vertical-align:1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:22px;font-family:var(--display)}
.stats span{font-size:12px;color:var(--muted);font-weight:600}
.pr{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:#3a1a14;border:1px solid var(--accent);font-weight:650}
.pr em{font-style:normal;font-size:11px;font-weight:800;color:var(--accent-ink);background:var(--accent);padding:2px 7px;border-radius:99px}
.tog{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--surface2);width:100%;text-align:left;font-weight:600}
.tog small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.sw{width:46px;height:28px;border-radius:99px;background:#2f4c72;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--accent)} .sw.on::after{transform:translateX(18px)}
#timer .t{font-size:34px}
#timer.done{animation:pulse .6s ease-in-out 3}
@keyframes pulse{50%{transform:scale(1.03)}}
#ob{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;background:radial-gradient(120% 60% at 50% -10%,rgba(212,175,80,.18),transparent 60%),var(--bg);padding:calc(var(--st) + 24px) 24px calc(var(--sb) + 20px);overflow-y:auto}
#ob.on{display:flex}
#ob .obm{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:460px;width:100%;margin:0 auto}
#ob .logo{display:flex;justify-content:center;filter:drop-shadow(0 0 16px rgba(212,175,80,.45))}
#ob h2{font-size:26px;text-align:center;letter-spacing:.04em}
#ob .lead{text-align:center;color:var(--muted);margin:0;font-size:16px}
#ob .steps{display:flex;flex-direction:column;gap:10px;margin:4px 0}
#ob .st{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px}
#ob .st b.n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--red);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-size:13px;border:1px solid var(--accent)}
#ob .obf{display:flex;flex-direction:column;gap:10px;max-width:460px;width:100%;margin:16px auto 0}
#ob .dots{display:flex;justify-content:center;gap:7px;margin-bottom:6px}
#ob .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
#ob .dots i.on{background:var(--accent);width:20px;border-radius:9px}
#ob .ok{color:var(--accent);font-weight:700;text-align:center}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:18px;border:1px solid #8a6a2a;background:linear-gradient(160deg,rgba(138,46,27,.6),rgba(15,38,68,.95) 65%)}
.hero .k{font-family:var(--display);font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:700}
.hero h2{font-size:24px;margin:6px 0 4px;letter-spacing:.02em}
.hero p{margin:0 0 14px;color:var(--muted);font-size:14px}
.hero .glow{position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(212,175,80,.28),transparent 70%);pointer-events:none}
.greet{font-family:var(--display);font-size:24px;letter-spacing:.02em}
.greet small{display:block;font-family:var(--font);font-size:14px;color:var(--muted);letter-spacing:0;margin-top:2px}
.wk{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.wkd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted)}
.wkd i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:14px;border:2px solid var(--line);color:var(--muted)}
.wkd.done i{background:var(--red);border-color:var(--accent);color:var(--accent)}
.wkd.today{border-color:var(--accent);color:var(--accent)}
.wkd.today i{border-color:var(--accent);color:var(--accent)}
.wkd.miss i{border-style:dashed}
.qa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qa button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;font-weight:650}
.qa button svg{color:var(--accent)}
.qa button small{color:var(--muted);font-weight:500;font-size:12.5px}
.bar{height:8px;border-radius:9px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--accent))}
.verse{text-align:center;font-family:var(--prayer);font-style:italic;font-size:18px;color:var(--muted);padding:6px 10px}
.rd{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.rd .lbl{font-family:var(--display);font-size:12.5px;letter-spacing:.14em;color:var(--accent);font-weight:700}
.rd .ref{font-weight:700;margin:4px 0 10px;font-size:15px}
.rd .txt{font-family:var(--prayer);font-size:calc(19px * var(--rs,1));line-height:1.6;-webkit-user-select:text;user-select:text}
.rd .txt sup{font-family:var(--font);font-size:.55em;color:var(--accent);margin-right:3px;vertical-align:.5em}

<script>
"use strict";
/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const dnum=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/864e5};
const fromNum=n=>{const d=new Date(n*864e5);return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`};
const wdOf=s=>new Date(dnum(s)*864e5).getUTCDay();
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const nice=s=>{const d=new Date(dnum(s)*864e5);return `${WD[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const fmt=n=>n==null?'':(Math.round(n*10)/10).toLocaleString();
function nextWeekday(wd){const t=dnum(today());for(let i=0;i<7;i++){if(wdOf(fromNum(t+i))===wd)return fromNum(t+i)}return today()}

/* ---------- program templates ---------- */
const ex=(name,target,unit='reps',cue='',load=true)=>({name,target,unit,cue,load});
function tplVertical(start){

    {n:'Build',s:'7 × 5 · last 2 sets @ 80%',pc:'6 × 3 · fast bar',c:'80–100 plyo contacts. Depth jumps start this week.'},

  const phases=W.map((w,i)=>({name:`Week ${i+1} · ${w.n}`,from:i+1,to:i+1,note:w.c,days:[
    {name:'Upper + Elastic Plyos',wd:2,focus:'Short upper, moderate plyos',ex:[iso,

    {name:'Short Upper + Jump Day',wd:5,focus:'Max-effort approach jumps',ex:[

  phases.push({name:'Week 4 · Deload & Peak',from:4,to:4,note:'Halve the volume, keep the weight heavy. Rest Thursday. Test on Friday.',days:[
    {name:'Upper + Plyos (light)',wd:2,focus:'Half volume',ex:[iso,ex('Bench press','3 × 3 @ 80%'),ex('Weighted pull-up','3 × 3'),

    {name:'TEST DAY',wd:5,focus:'No lifting. Warm up, ramp, test.',ex:[
      ex('Ramp jumps','2 each @ 30/50/70/90%','reps','',false),
      ex('Max approach jump','5–8 × 1 @ 100%','cm','Log touch height',false),
      ex('Standing vertical','1 × 3','in','Compare with Day 1',false)]}]});
  return {name:'30-Day Vertical Jump',start,phases,tests:[
    {name:'Standing vertical',unit:'in'},{name:'Approach vertical',unit:'in'},{name:'Max touch height',unit:'cm'},{name:'Back squat (est. max)',unit:'kg'}]};
}
function tplTigi(start){
  const P=(name,from,to,note,days)=>({name,from,to,note,days});
  const D=(name,wd,focus,list)=>({name,wd,focus,ex:list});
  const wu='Every session: 10-min warm-up (gratitude moment, cardio, mobility, band pull-aparts, sprints), then 5-min cool-down.';
  return {name:'12-Week Strength Program',start,warmup:TIGI_WU(),cooldown:TIGI_CD(),tests:[
    {name:'Broad jump',unit:'cm'},{name:'Dead hang',unit:'sec'},{name:"Farmer's walk max distance",unit:'m'},
    {name:'Front plank',unit:'sec'},{name:'Med ball rotational throw L',unit:'m'},{name:'Med ball rotational throw R',unit:'m'}],
  phases:[
   P('Spring Training',1,4,'Learn every movement with bodyweight or light dumbbells. Rest 60–90 s. '+wu,[
    D('Strength A: Legs + Pull',2,'Hardest day',[ex('Goblet squat','3 × 8','reps','Sit between the heels'),ex('Reverse lunge','3 × 6/leg','reps','Knee gently touches the floor',false),ex('Inverted row','3 × 8','reps','Body straight as a plank',false),ex('Dead hang','3 × 20 s','sec','Shoulders down, not shrugged',false),ex('Dead bug','3 × 6/side','reps','Lower back pressed to the floor',false),ex('Side plank','2 × 20 s/side','sec','Hips high',false)]),
    D('Explosive + Core',3,'Fast and snappy',[ex('Box jump','4 × 3','reps','30–45 cm box, land soft, step down',false),ex('Lateral bound and stick','3 × 4/side','reps','Hold landing 2 s on one leg',false),ex('Med ball rotational wall throw','3 × 5/side','reps','2–3 kg ball, power from the hips'),ex('Med ball chest pass','3 × 6','reps','Throw hard against a wall'),ex('Hanging knee raise','3 × 6','reps','Slow, no swinging',false),ex('Front plank','3 × 30 s','sec','Squeeze glutes and abs',false)]),
    D('Strength B: Hinge, Push + Grip',5,'Hard day',[ex('Dumbbell Romanian deadlift','3 × 8','reps','Hips back, flat back, soft knees'),ex('Glute bridge','3 × 10','reps','Pause 2 s at the top',false),ex('Push-up','3 × 6–10','reps','Hands on a bench if form breaks',false),ex('One-arm dumbbell row','3 × 8/side','reps','Elbow to hip'),ex("Farmer's walk",'3 × 30 m','m','Tall posture, tight core'),ex('Pallof press','3 × 8/side','reps','Resist the band',false)]),
    D('Power, Grip + Carries',0,'Moderate and fun',[ex('Box jump','3 × 3','reps','Same box as Wednesday',false),ex('Broad jump and stick','3 × 3','cm','Freeze the landing',false),ex('Med ball slam','3 × 6','reps','Reach tall, slam hard'),ex("Farmer's walk",'3 × 30 m','m','Same weight as Friday'),ex('Suitcase carry','2 × 20 m/side','m',"One dumbbell, don't lean"),ex('Plate pinch hold','3 × 15 s','sec','Smooth side out')])]),
   P('Regular Season',5,8,'Get stronger: heavier loads, harder versions. Rest 90 s on strength lifts. Week 8 is lighter: one fewer set each.',[
    D('Strength A: Legs + Pull',2,'Hardest day',[ex('Goblet squat','4 × 6–8','reps','Heavier than Phase 1'),ex('Rear-foot elevated split squat','3 × 6/leg','reps','Add light dumbbells once easy'),ex('Lat pulldown / band-assisted pull-up','3 × 6–8','reps','Chest up, pull to upper chest'),ex('Inverted row','3 × 10','reps','Feet further forward',false),ex('Dead hang','3 × 30 s','sec','',false),ex('Hanging leg raise','3 × 5–8','reps','Straighter legs as she improves',false)]),
    D('Explosive + Core',3,'Fast and snappy',[ex('Box jump','4 × 3','reps','Raise box 5–10 cm only if landings stay soft',false),ex('Lateral box jump','3 × 3/side','reps','Step down',false),ex('Med ball rotational scoop toss','3 × 5/side','reps','3 kg, explode from the back hip'),ex('Skater hops','3 × 5/side','reps','',false),ex('Hanging leg raise','3 × 6','reps','Slow on the way down',false),ex('Side plank with reach-through','2 × 6/side','reps','',false)]),
    D('Strength B: Hinge, Push + Grip',5,'Hard day',[ex('Trap bar deadlift','4 × 5','reps','Start light, learn with a coach'),ex('Dumbbell hip thrust','3 × 10','reps','Pause at the top'),ex('Push-up','3 × 8–12','reps','Full push-ups now',false),ex('Half-kneeling one-arm DB press','3 × 8/side'),ex("Farmer's walk",'4 × 40 m','m','Heavier than Phase 1'),ex('Pallof press with hold','3 × 6/side','reps','Hold 3 s at full extension',false)]),
    D('Power, Grip + Carries',0,'Moderate and fun',[ex('Box jump','3 × 3','reps','Max intent, soft landings',false),ex('Broad jump, 2 in a row','3 × 2','cm','Stick the second',false),ex('Med ball rotational slam','3 × 5/side'),ex("Farmer's walk",'3 × 40 m','m'),ex('Front rack carry','2 × 30 m','m'),ex('Towel hang','3 × 15–20 s','sec','Huge grip builder',false),ex('Wrist roller','2 rounds','reps','Forearms for bat speed')])]),
   P('Finals Series',9,12,'Strength into speed: do each 1a then 1b, rest 60 s, repeat. Full effort on every jump and throw. Week 12 is lighter, then retest.',[
    D('Strength A + Power Pairs',2,'Hardest day',[ex('1a. Goblet / front squat','4 × 5','reps','Heaviest clean reps of the program'),ex('1b. Box jump','4 × 3','reps','Straight after the squats',false),ex('2a. Rear-foot elevated split squat','3 × 6/leg'),ex('2b. Split squat jump','3 × 4/leg','reps','Land soft',false),ex('Pull-up (assisted if needed)','3 × 4–6','reps','Full hang to chin over bar',false),ex('Hanging leg raise','3 × 8','reps','',false)]),
    D('Explosive + Core',3,'Fast and snappy',[ex('Single-leg box jump','3 × 3/leg','reps','Land on two feet',false),ex('Lateral bound to sprint','4 × 1/side','reps','Bound, stick, sprint 10 m',false),ex('Med ball rotational scoop toss','4 × 4/side','reps','Max effort: this is her swing'),ex('Med ball overhead throw','3 × 5'),ex('Ab wheel rollout','3 × 6','reps','Stop before the lower back sags',false),ex('Copenhagen plank','2 × 15 s/side','sec','',false)]),
    D('Strength B + Power Pairs',5,'Hard day',[ex('1a. Trap bar deadlift','4 × 4','reps','2–3 reps in the tank'),ex('1b. Broad jump','4 × 2','cm','Explode out of the lift',false),ex('2a. Push-up (vest or feet raised)','3 × 8','reps','',false),ex('2b. Med ball chest pass','3 × 5'),ex('One-arm dumbbell row','3 × 8/side'),ex("Heavy farmer's walk",'4 × 30 m','m','Heaviest carries of the program')]),
    D('Power, Grip + Carries',0,'Moderate and fun',[ex('Box jump (higher box)','3 × 3','reps','Only if landings stay soft',false),ex('Lateral box jump','3 × 3/side','reps','',false),ex('Med ball rotational slam','3 × 5/side'),ex("Farmer's + suitcase carry",'3 rounds','m','30 m farmer’s then 20 m suitcase each side'),ex('Towel pull-up hang','3 × 20 s','sec','',false),ex('Plate pinch hold','3 × 30 s','sec','Heavier plates'),ex('Wrist roller','3 rounds')])])]};
}
const JUMP=/jump|bound|hop|skater|med ball|slam|throw|toss|pass|sprint|swing|ramp|approach|vertical|pogo|depth|hurdle/i;
const CORE=/plank|dead bug|hang|pallof|pinch|knee raise|leg raise|rollout|wrist|isometric/i;
const ACC=/lateral raise|face pull|calf raise|hip thrust|row|knee raise/i;
function restFor(prName,pi,n){
  if(/vertical jump/i.test(prName)){if(/isometric/i.test(n))return 60;if(/max approach/i.test(n))return 60;if(JUMP.test(n))return 45;if(ACC.test(n))return 90;return 120}
  if(/12-week/i.test(prName)){if(/^\d+a\./.test(n))return 0;if(/^\d+b\./.test(n))return 60;if(JUMP.test(n))return 90;if(CORE.test(n))return 60;return pi===0?75:90}
  return null}
function fillRest(pr){(pr.phases||[]).forEach((ph,pi)=>ph.days.forEach(d=>d.ex.forEach(e=>{if(e.rest===undefined||e.rest===null){const r=restFor(pr.name,pi,e.name);if(r!=null)e.rest=r}})));return pr}
const fmtRest=r=>r===0?'No rest':r>=60?`${Math.floor(r/60)}:${pad(r%60)}`:`${r}s`;
const PRAY_START=`Heavenly Father, as I prepare to begin this workout, I ask you for strength of body, mind, and spirit, so that I may stay fit for your Kingdom. Strengthen my body so that I may use it as a vessel to carry out your work in this world. Grant me a clear and focused mind, free from distractions and doubts, as I push myself to new limits. Fill my spirit with your grace, Lord, so that I may approach this training with humility and gratitude.
As I sweat and grind at the gym, may this workout be a reminder of the greater battles we face in life, and may I draw strength from the knowledge that you are with me always.
In your holy name, I pray and train. Amen.`;
const PRAY_END=`Lord Jesus, you invite us to do everything in this life for your greater glory. Thank you for giving me this opportunity to praise you through physical exercise. May I ever keep in mind that You are my strength and my shield. Having attuned my mind to Your Will may I overcome the weakness of the flesh. Amen.`;
const TIGI_WU=()=>[{name:'Light cardio (rope, bike or jog)',amt:'3 min'},{name:"World's greatest stretch",amt:'3 per side'},{name:'Bodyweight squats',amt:'10'},{name:'Walking lunge with twist',amt:'6 per leg'},{name:'Glute bridges',amt:'10'},{name:'Band pull-aparts',amt:'15'},{name:'Arm circles',amt:'10 each way'},{name:'Fast sprints or skips',amt:'2 × 10 m'}];
const TIGI_CD=()=>[{name:'Easy walk',amt:'1–2 min'},{name:'Hip flexor stretch',amt:'30 s per side'},{name:'Hamstring stretch',amt:'30 s per side'},{name:'Sleeper stretch (gentle)',amt:'30 s per side'},{name:"Child's pose",amt:'30 s'}];
const tplFree=()=>({name:'My workouts',start:today(),phases:[],tests:[]});
const TEMPLATES=[
  {k:'vertical',name:'30-Day Vertical Jump',d:'4 weeks · Tue/Wed/Fri · lifting + plyos',make:()=>fillRest(tplVertical(nextWeekday(2)))},
  {k:'tigi',name:'12-Week Strength Program',d:'3 phases · Tue/Wed/Fri/Sun · grip, core, power',make:()=>fillRest(tplTigi(nextWeekday(2)))},
  {k:'free',name:'Free training',d:'No set plan. Log whatever you do and repeat past workouts.',make:tplFree}];

/* ---------- state ---------- */
const KEY='repbook.v1';
let S, mem=false;
function fresh(){
  return {v:1,welcomed:false,active:null,hideInstall:false,sound:true,keepAwake:true,alarm:'church',prayers:{start:PRAY_START,end:PRAY_END},profiles:[
    {id:uid(),name:'Jasha',color:'#d4af50',rest:120,program:fillRest(tplVertical('2026-11-17'))},
    {id:uid(),name:'Tigi',color:'#8fb8e8',rest:75,program:fillRest(tplTigi(nextWeekday(2)))},
    {id:uid(),name:'Teonie (aka best mum ever)',color:'#e39a85',rest:60,program:tplFree()}],
    logs:[],tests:[],drafts:{}};
}
function load(){try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);return}}catch(e){mem=true}S=fresh()}
let saveT;function save(now){clearTimeout(saveT);const w=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){mem=true}};now?w():saveT=setTimeout(w,250)}
load();

function refQuery(ref){
  let r=String(ref||'').split(/\s+or\s+/i)[0].replace(/^cf\.?\s*/i,'').replace(/\s+and\s+/gi,',').replace(/;/g,',').replace(/(\d)[a-g]+\b/g,'$1').replace(/\s*,\s*/g,',').replace(/\s*-\s*/g,'-').trim();
  const m=r.match(/^((?:[1-3]\s*)?[A-Za-z][A-Za-z .]*?)\s+(\d[\d:,\-]*)$/);if(!m)return null;
  let book=m[1].trim(),rest=m[2];if(ONE_CH.test(book)&&!rest.includes(':'))rest='1:'+rest;
  if(/^psalms?$/i.test(book))book='psalms';return book+' '+rest}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()}
function bgQuery(ref){return String(ref||'').split(/\s+or\s+/i)[0].replace(/^cf\.?\s*/i,'').replace(/\s+and\s+/gi,',').replace(/(\d)[a-g]+\b/g,'$1').replace(/\s*([,;:\-])\s*/g,'$1').trim()}
async function nabre(ref){
  const j=await getJSON('https://query.bibleget.io/v3/?query='+encodeURIComponent(bgQuery(ref))+'&version=NABRE&return=json&appid=athleta-christi');
  const rs=(j&&j.results)||[];if(!rs.length)return null;
  return {verses:rs.map(r=>({c:r.chapter,v:r.verse||r.versenumber||'',t:String(r.text||'').replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim()})).filter(v=>v.t),tr:'New American Bible, Revised Edition (NABRE)'}}
async function passage(ref,isPsalm){
  try{const n=await nabre(ref);if(n&&n.verses.length)return n}catch(e){}
  const q=refQuery(ref);if(!q)return null;
  const tries=isPsalm?['web']:['dra','web'];
  for(const t of tries){try{const j=await getJSON('https://bible-api.com/'+encodeURIComponent(q)+'?translation='+t);if(j&&j.verses&&j.verses.length)return {verses:j.verses.map(v=>({c:v.chapter,v:v.verse,t:String(v.text).replace(/\s+/g,' ').trim()})),tr:j.translation_name||t}}catch(e){}}

async function loadReadings(date){

  rdCache[date]={state:'loading'};

    let cal=null;try{cal=await getJSON(`${RAPI}/liturgical-calendar/${y}/${m}-${d}.json`)}catch(e){}
    const rs=R.readings||{};const parts=[['First reading','firstReading'],['Responsorial psalm','psalm'],['Second reading','secondReading'],['Gospel','gospel']].filter(([,k])=>rs[k]);
    let celeb='';if(cal){const c=cal.celebration||cal;celeb=typeof c==='string'?c:(c.name||c.title||'')}

function spark(vals){
  if(vals.length<2)return '';
  const W=300,H=56,P=5;const mn=Math.min(...vals),mx=Math.max(...vals);const rg=mx-mn||1;
  const pts=vals.map((v,i)=>[P+i*(W-2*P)/(vals.length-1),H-P-(v-mn)/rg*(H-2*P)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="M${P} ${H-P}H${W-P}" stroke="var(--line)" stroke-width="1"/><path d="${line} L${last[0]} ${H} L${P} ${H}Z" fill="var(--accent)" opacity=".14"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="4" fill="var(--accent)"/></svg>`;
}

function voice(f,at,dur,vol){const o=AC.createOscillator(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain(),flt=AC.createBiquadFilter();o.type='triangle';o.frequency.value=f;l.frequency.value=5;lg.gain.value=f*.012;l.connect(lg);lg.connect(o.frequency);flt.type='lowpass';flt.frequency.value=1400;g.gain.setValueAtTime(.0001,at);g.gain.linearRampToValueAtTime(vol,at+.12);g.gain.setValueAtTime(vol,at+dur-.12);g.gain.linearRampToValueAtTime(.0001,at+dur);o.connect(flt);flt.connect(g);g.connect(out());o.start(at);l.start(at);o.stop(at+dur+.05);l.stop(at+dur+.05);sched.push(o,l)}

  church:{name:'Church bell',d:'Two deep tolls of a tower bell.',cat:'Catholic',play:t=>{bell(N(57),t,4,.5,CHURCH);bell(N(57),t+1.6,4,.5,CHURCH)}},

function alarmAt(base){const k=SOUNDS[S.alarm]?S.alarm:'church';try{SOUNDS[k].play(base)}catch(e){}}
function scheduleSounds(){clearSched();if(!S.sound)return;unlockAudio();if(!AC)return;const left=(tEnd-Date.now())/1000;const base=AC.currentTime+Math.max(0,left);
  if(S.ticks!==false)[3,2,1].forEach(k=>{if(left>k+.2)osc('sine',k===1?1046:784,base-k,.12,.14)});alarmAt(base)}
function testSound(k){unlockAudio();clearSched();if(AC){if(k&&SOUNDS[k])SOUNDS[k].play(AC.currentTime+.05);else alarmAt(AC.currentTime+.05)}try{navigator.vibrate&&navigator.vibrate([300,120,300])}catch(e){}}
let wl=null;async function wake(){if(!S.keepAwake||wl||!('wakeLock' in navigator)||document.visibilityState!=='visible')return;try{wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}catch(e){}}
function sleepOk(){try{wl&&wl.release()}catch(e){}wl=null}
function startTimer(sec,name){if(!sec)return;tLen=sec;tEnd=Date.now()+sec*1000;tName=name||'';fired=false;
  $('#timer').classList.add('on');document.body.classList.add('timing');$('#timer').classList.remove('done');clearInterval(tInt);tInt=setInterval(tick,250);scheduleSounds();wake();tick()}
function fire(){if(fired)return;fired=true;clearInterval(tInt);$('#timer').classList.add('done');$('#tlabel').textContent='Rest done. Next set!';$('#tval').textContent='0:00';$('#tbar').style.width='0%';
  try{navigator.vibrate&&navigator.vibrate([400,150,400,150,400])}catch(e){}
  if(document.visibilityState!=='visible')notify();
  setTimeout(()=>{if(fired&&Date.now()>=tEnd+8000)stopTimer()},8500)}
function notify(){try{if(!('Notification' in window)||Notification.permission!=='granted')return;const o={body:tName?`Next set: ${tName}`:'Time for your next set',tag:'rest',renotify:true,vibrate:[400,150,400],icon:'icons/icon-192.png'};
  if(navigator.serviceWorker&&navigator.serviceWorker.controller)navigator.serviceWorker.ready.then(r=>r.showNotification('Rest done',o));else new Notification('Rest done',o)}catch(e){}}
function tick(){const left=Math.max(0,Math.ceil((tEnd-Date.now())/1000));
  if(left<=0){fire();return}
  $('#tval').textContent=`${Math.floor(left/60)}:${pad(left%60)}`;$('#tbar').style.width=(100*left/tLen)+'%';$('#tlabel').textContent=tName?`Rest · ${tName}`:'Rest'}
function stopTimer(){clearInterval(tInt);clearSched();fired=true;$('#timer').classList.remove('on');document.body.classList.remove('timing')}

  newtest(){formSheet('New test',[{k:'name',label:'Test name',value:'',ph:'e.g. Bodyweight, 20 m sprint'},{k:'unit',label:'Unit',value:'',ph:'kg, sec, cm, in…'},{k:'value',label:'First result (optional)',value:'',mode:'decimal'}],v=>{
    if(!v.name){toast('Name the test');return false}const n=num(v.value);
    if(n!=null)S.tests.push({id:uid(),pid:S.active,name:v.name,unit:v.unit,value:n,date:today()});
    else{const pr=prof().program;pr.tests=pr.tests||[];pr.tests.push({name:v.name,unit:v.unit})}save();render()})},
  logtest(el){const t=testNames()[+el.dataset.i];formSheet(t.name,[{k:'value',label:`Result (${t.unit})`,value:'',mode:'decimal'},{k:'date',label:'Date',type:'date',value:today()}],v=>{
    const n=num(v.value);if(n==null){toast('Enter a number');return false}S.tests.push({id:uid(),pid:S.active,name:t.name,unit:t.unit,value:n,date:v.date||today()});save();render();toast('Result saved')})},
  testhist(el){const t=testNames()[+el.dataset.i];const rs=S.tests.filter(x=>x.pid===S.active&&x.name===t.name).sort((a,b)=>b.date.localeCompare(a.date));
    openSheet(`<h2>${esc(t.name)}</h2>`+rs.map(r=>`<div class="row card"><span class="sp">${nice(r.date)}</span><b class="num">${fmt(r.value)} ${esc(t.unit)}</b><button class="icon" data-act="deltest" data-id="${r.id}" aria-label="Delete result">✕</button></div>`).join('')+`<button class="btn full" data-act="close">Close</button>`)},
  deltest(el){S.tests=S.tests.filter(x=>x.id!==el.dataset.id);save();closeSheet();render()},
  pbd(el){const b=bests()[+el.dataset.i];openSheet(`<h2>${esc(b.name)}</h2><p class="note">Best set: <b style="color:var(--ink)">${setStr(b.best,b.unit,b.load)}</b> on ${nice(b.bestDate)}</p><div class="card">${spark(b.series)||'<p class="note">Log this exercise again to see a trend.</p>'}<p class="small muted" style="margin:6px 0 0">Top ${b.load?'weight':esc(b.unit)} each session (${b.series.length} sessions)</p></div><button class="btn full" data-act="close">Close</button>`)},
  install(){if(!deferred)return;deferred.prompt();deferred.userChoice.finally(()=>{deferred=null;render()})},
  hideinstall(){S.hideInstall=true;save();render()},
  togph(el){const pi=+el.dataset.p;const pr=prof().program;const ph=pr.phases[pi];const cur=ui.openPh[pi]??(curWeek(pr)>=+ph.from&&curWeek(pr)<=+ph.to);ui.openPh[pi]=!cur;render()},
  editprog(){const pr=prof().program;formSheet('Program',[{k:'name',label:'Program name',value:pr.name},{k:'start',label:'Start date (week 1, day 1)',type:'date',value:pr.start}],v=>{pr.name=v.name||pr.name;if(v.start)pr.start=v.start;tmp={};save();resetPos();render()})},
  restset(){const p=prof();formSheet('Rest timer',[{k:'rest',label:'Default rest in seconds, used when an exercise has no rest time of its own',value:p.rest,mode:'numeric'}],v=>{p.rest=Math.max(0,parseInt(v.rest)||0);save();render()})},
  templates(){openSheet(`<h2>Switch program</h2><p class="note">This replaces ${esc(prof().name)}'s plan. Past workouts and tests are kept.</p>`+TEMPLATES.map(t=>`<button class="opt" data-act="usetpl" data-k="${t.k}"><div class="sp">${esc(t.name)}<small>${esc(t.d)}</small></div></button>`).join('')+`<button class="btn full" data-act="close">Cancel</button>`)},
  usetpl(el){const t=TEMPLATES.find(x=>x.k===el.dataset.k);closeSheet();confirmSheet(`Switch to ${t.name}?`,'The current plan and any unfinished workouts will be replaced.','Switch program',()=>{const p=prof();p.program=t.make();S.drafts[p.id]={};save();resetPos();ui.openPh={};render(false);toast('Program switched')})},
  editph(el){const pr=prof().program;const ph=pr.phases[+el.dataset.p];
    formSheet('Edit phase',[{k:'name',label:'Phase name',value:ph.name},{k:'from',label:'From week',value:ph.from,mode:'numeric'},{k:'to',label:'To week',value:ph.to,mode:'numeric'},{k:'note',label:'Notes',type:'textarea',value:ph.note}],v=>{
      ph.name=v.name||ph.name;ph.from=Math.max(1,parseInt(v.from)||1);ph.to=Math.max(ph.from,parseInt(v.to)||ph.from);ph.note=v.note;tmp={};save();resetPos();render()},`<button class="btn dang full" id="xdel">Delete phase</button>`);
    $('#xdel').onclick=()=>confirmSheet('Delete phase?',`"${ph.name}" and all its days will be removed.`,'Delete',()=>{pr.phases.splice(+el.dataset.p,1);tmp={};save();resetPos();render()})},
  newph(){const pr=prof().program;const n=pr.phases.length?totalWeeks(pr)+1:1;
    if(!pr.phases.length)pr.start=pr.start||today();
    formSheet('New phase',[{k:'name',label:'Phase name',value:'',ph:'e.g. Routine'},{k:'from',label:'From week',value:n,mode:'numeric'},{k:'to',label:'To week',value:n+3,mode:'numeric'},{k:'note',label:'Notes',type:'textarea',value:''}],v=>{
      pr.phases.push({name:v.name||'Phase',from:Math.max(1,parseInt(v.from)||n),to:Math.max(parseInt(v.from)||n,parseInt(v.to)||n),note:v.note,days:[]});
      ui.openPh[pr.phases.length-1]=true;save();resetPos();render()})},
  newday(el){const ph=prof().program.phases[+el.dataset.p];
    formSheet('New training day',[{k:'name',label:'Day name',value:'',ph:'e.g. Upper body'},{k:'wd',label:'Day of the week',type:'select',value:1,options:WDOPT}],v=>{
      ph.days.push({name:v.name||'Workout',wd:+v.wd,focus:'',ex:[]});ph.days.sort((a,b)=>((a.wd+6)%7)-((b.wd+6)%7));tmp={};save();render()})},
  editday(el){const ph=prof().program.phases[+el.dataset.p];const d=ph.days[+el.dataset.d];
    formSheet('Edit day',[{k:'name',label:'Day name',value:d.name},{k:'wd',label:'Day of the week',type:'select',value:d.wd,options:WDOPT}],v=>{
      d.name=v.name||d.name;d.wd=+v.wd;ph.days.sort((a,b)=>((a.wd+6)%7)-((b.wd+6)%7));tmp={};save();resetPos();render()},`<button class="btn dang full" id="xdel">Delete day</button>`);
    $('#xdel').onclick=()=>confirmSheet('Delete day?',`"${d.name}" will be removed from this phase.`,'Delete',()=>{ph.days.splice(+el.dataset.d,1);tmp={};save();resetPos();render()})},
  newex(el){const d=prof().program.phases[+el.dataset.p].days[+el.dataset.d];
    formSheet('Add exercise to '+d.name,exFields({name:'',target:'3 × 10',unit:'reps',load:true,cue:''}),v=>{if(!v.name){toast('Give the exercise a name');return false}d.ex.push(exFrom(v));tmp={};save();render()},dl())},
  editex(el){const d=prof().program.phases[+el.dataset.p].days[+el.dataset.d];const xi=+el.dataset.x;const e=d.ex[xi];
    formSheet('Edit exercise',exFields(e),v=>{if(!v.name)return false;d.ex[xi]=exFrom(v);tmp={};save();render()},dl()+`<div class="row"><button class="btn sm sp" id="xup">Move up</button><button class="btn sm sp" id="xdn">Move down</button></div><button class="btn dang full" id="xdel">Delete exercise</button>`);
    const mv=k=>{const j=xi+k;if(j<0||j>=d.ex.length)return;[d.ex[xi],d.ex[j]]=[d.ex[j],d.ex[xi]];tmp={};save();closeSheet();render()};
    $('#xup').onclick=()=>mv(-1);$('#xdn').onclick=()=>mv(1);
    $('#xdel').onclick=()=>{d.ex.splice(xi,1);tmp={};save();closeSheet();render()}},
  profiles(){
    openSheet(`<h2>Who's training?</h2>`+S.profiles.map(p=>`<button class="opt ${p.id===S.active?'on':''}" data-act="pick" data-id="${p.id}"><span class="av" style="background:${esc(p.color)}">${esc((p.name.trim()[0]||'?').toUpperCase())}</span><div class="sp">${esc(p.name)}<small>${esc(p.program.name)}</small></div></button>`).join('')+
      `<div class="row"><button class="btn sp" data-act="editme">Edit ${esc(prof().name)}</button><button class="btn sp" data-act="addperson">+ Add person</button></div><button class="btn full" data-act="close">Done</button>`)},
  pick(el){S.active=el.dataset.id;S.welcomed=true;save();closeSheet();resetPos();ui.openPh={};render(false)},
  editme(){const p=prof();const cols=['#d4af50','#8fb8e8','#e39a85','#a9c29a','#c9a0dc','#e8d8b0','#7fc6c2'];
    formSheet('Edit person',[{k:'name',label:'Name',value:p.name},{k:'color',label:'Colour',type:'select',value:p.color,options:cols.map((c,i)=>[c,['Gold','Sky blue','Rose','Sage','Lilac','Parchment','Teal'][i]])}],v=>{p.name=v.name||p.name;p.color=v.color;save();render()},
      S.profiles.length>1?`<button class="btn dang full" id="xdel">Remove ${esc(p.name)}</button>`:'');
    const x=$('#xdel');if(x)x.onclick=()=>confirmSheet(`Remove ${p.name}?`,'Their program, workouts and test results will be deleted from this phone.','Remove',()=>{S.profiles=S.profiles.filter(q=>q.id!==p.id);S.logs=S.logs.filter(l=>l.pid!==p.id);S.tests=S.tests.filter(t=>t.pid!==p.id);delete S.drafts[p.id];S.active=S.profiles[0].id;save();resetPos();render(false)})},
  addperson(){formSheet('Add person',[{k:'name',label:'Name',value:''},{k:'tpl',label:'Starting program',type:'select',value:'free',options:TEMPLATES.map(t=>[t.k,t.name])}],v=>{
    if(!v.name){toast('Enter a name');return false}const t=TEMPLATES.find(x=>x.k===v.tpl);const cols=['#a9c29a','#c9a0dc','#e8d8b0','#7fc6c2'];
    const p={id:uid(),name:v.name,color:cols[S.profiles.length%cols.length],rest:90,program:t.make()};S.profiles.push(p);S.active=p.id;save();resetPos();render(false);if($('#ob').classList.contains('on'))obRender()})},
  backup(){const data=JSON.stringify(S);
    openSheet(`<h2>Back up</h2><p class="note">Save this file somewhere safe (Files, Google Drive, email it to yourself). Restore it on any phone.</p><button class="btn pri full" id="bdl">Save backup file</button><button class="btn full" id="bcp">Copy backup text</button><button class="btn full" data-act="close">Close</button>`);
    $('#bdl').onclick=async()=>{const name=`athleta-christi-backup-${today()}.json`;const blob=new Blob([data],{type:'application/json'});
      try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Athleta Christi backup'});return}}catch(e){if(e&&e.name==='AbortError')return}
      try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Backup saved')}catch(e){toast('Saving files is blocked here. Use Copy instead.')}};
    $('#bcp').onclick=()=>navigator.clipboard.writeText(data).then(()=>toast('Backup copied'),()=>toast('Copy was blocked'))},
  restore(){openSheet(`<h2>Restore</h2><p class="note">Pick a backup file, or paste backup text. This replaces everything on this phone.</p><input class="fi" type="file" id="rfile" accept=".json,application/json"><textarea class="fi" id="rtext" placeholder="…or paste backup text here"></textarea><button class="btn pri full" id="rgo">Restore</button><button class="btn full" data-act="close">Cancel</button>`);
    $('#rgo').onclick=async()=>{let txt=$('#rtext').value.trim();const f=$('#rfile').files[0];if(f)txt=await f.text();
      try{const o=JSON.parse(txt);if(!o||!Array.isArray(o.profiles)||!o.profiles.length)throw 0;S=Object.assign(fresh(),o);S.welcomed=true;if(!S.profiles.find(p=>p.id===S.active))S.active=S.profiles[0].id;save(true);closeSheet();resetPos();render(false);toast('Backup restored')}catch(e){toast("That isn't a Athleta Christi backup")}}},
  t30(){if(fired)tEnd=Date.now();tEnd+=30000;tLen=Math.max(tLen,(tEnd-Date.now())/1000);fired=false;$('#timer').classList.remove('done');clearInterval(tInt);tInt=setInterval(tick,250);scheduleSounds();tick()},
  tstop(){stopTimer()},
  tswap(){A.tab({dataset:{t:ui.tab==='readings'?'today':'readings'}})},
};
document.addEventListener('click',e=>{unlockAudio();const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el,e)}});
main.addEventListener('input',e=>{const t=e.target;const f=t.dataset.f;if(!f)return;const dr=getDraft();
  if(f==='notes')dr.notes=t.value;else if(f==='date')dr.date=t.value;
  else{const s=dr.entries[+t.dataset.e].sets[+t.dataset.s];s[f]=t.value}
  touch(dr)});
main.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){const ins=[...main.querySelectorAll('.srow input')];const i=ins.indexOf(e.target);if(i>-1){e.preventDefault();(ins[i+1]||e.target).focus();if(!ins[i+1])e.target.blur()}}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){save(true);return}unlockAudio();if(isTouched())wake();if(tEnd&&$('#timer').classList.contains('on')&&!fired){if(Date.now()>=tEnd){fire();if(S.sound&&AC)alarmAt(AC.currentTime+.05)}else{scheduleSounds();tick()}}});

/* ---------- first-launch setup ---------- */
const isAndroid=/android/i.test(navigator.userAgent);
const OBMARK=`<svg width="96" height="96" viewBox="160 70 280 300" aria-hidden="true"><circle cx="300" cy="225" r="96" fill="#8a2e1b" stroke="#d4af50" stroke-width="12"/><circle cx="300" cy="84.0" r="9.0" fill="#d4af50" stroke="#2a0f08" stroke-width="1.5"/><rect x="294.0" y="92.0" width="12.0" height="40.0" rx="3.0" fill="#9e6324" stroke="#2a0f08" stroke-width="1.5"/><line x1="294.0" y1="97.0" x2="306.0" y2="101.0" stroke="#2a0f08" stroke-width="1.0" opacity=".6"/><line x1="294.0" y1="105.0" x2="306.0" y2="109.0" stroke="#2a0f08" stroke-width="1.0" opacity=".6"/><line x1="294.0" y1="113.0" x2="306.0" y2="117.0" stroke="#2a0f08" stroke-width="1.0" opacity=".6"/><line x1="294.0" y1="121.0" x2="306.0" y2="125.0" stroke="#2a0f08" stroke-width="1.0" opacity=".6"/><line x1="294.0" y1="129.0" x2="306.0" y2="133.0" stroke="#2a0f08" stroke-width="1.0" opacity=".6"/><rect x="204.0" y="134.5" width="192.0" height="9.0" rx="4.5" fill="#d4af50" stroke="#2a0f08" stroke-width="1.5"/><rect x="240.0" y="128.0" width="8.0" height="22.0" rx="3.0" fill="#d4af50" stroke="#2a0f08" stroke-width="1.5"/><rect x="225.5" y="106.0" width="13.0" height="66.0" rx="3.0" fill="#d4af50" stroke="#2a0f08" stroke-width="1.5"/><rect x="211.5" y="115.0" width="11.0" height="48.0" rx="3.0" fill="#d4af50" stroke="#2a0f08" stroke-width="1.5"/><rect x="352.0" y="128.0" width="8.0" height="22.0" rx="3.0" fill="#d4af50" stroke="#2a0f08" stroke-width="1.5"/><rect x="361.5" y="106.0" width="13.0" height="66.0" rx="3.0" fill="#d4af50" stroke="#2a0f08" stroke-width="1.5"/><rect x="377.5" y="115.0" width="11.0" height="48.0" rx="3.0" fill="#d4af50" stroke="#2a0f08" stroke-width="1.5"/><path d="M288.0,143.5 L312.0,143.5 L311.0,341.0 L300,375 L289.0,341.0 Z" fill="#ece2c8" stroke="#2a0f08" stroke-width="1.5"/><line x1="300" y1="149.5" x2="300" y2="345.0" stroke="#2a0f08" stroke-width="1.4" opacity=".45"/></svg>`;
let ob={step:0,msg:''};
const notifSupported=()=>'Notification' in window;
function settingsPath(){
  if(isIOS)return ['Open the <b>Settings</b> app','Tap <b>Notifications</b>, then scroll down and tap <b>Athleta</b>','Turn on <b>Allow Notifications</b> and <b>Sounds</b>'];
  if(isAndroid)return ['Press and hold the <b>Athleta</b> icon on your home screen','Tap <b>App info</b> (the ⓘ)','Tap <b>Notifications</b> and turn them <b>on</b>'];
  return ['Open your browser settings','Find <b>Site settings › Notifications</b>','Allow notifications for this app'];
}
const stepsHtml=a=>`<div class="steps">${a.map((t,i)=>`<div class="st"><b class="n">${i+1}</b><span>${t}</span></div>`).join('')}</div>`;
function obSteps(){const L=['install','who','notif','sound','done'];return L.filter(k=>!(k==='install'&&standalone())&&!(k==='notif'&&!notifSupported()))}
function obRender(){
  const L=obSteps();const k=L[Math.min(ob.step,L.length-1)];const el=$('#ob');
  const dots=`<div class="dots">${L.map((_,i)=>`<i class="${i===ob.step?'on':''}"></i>`).join('')}</div>`;
  let m='',f='';
  if(k==='install'){
    m=`<div class="logo">${OBMARK}</div><h2>Install Athleta Christi</h2><p class="lead">Put it on your home screen so it opens full screen like a normal app, keeps your workouts safe, and can send rest alerts.</p>`+
      (deferred?'':stepsHtml(isIOS?['Tap the <b>Share</b> button (the square with an arrow ⬆︎) at the bottom of Safari','Scroll down and tap <b>Add to Home Screen</b>','Tap <b>Add</b>, then open <b>Athleta</b> from your home screen']:isAndroid?['Tap the <b>⋮</b> menu at the top right of Chrome','Tap <b>Install app</b> or <b>Add to Home screen</b>','Open <b>Athleta</b> from your home screen']:['Use your browser menu to <b>Install</b> this app']));
    f=(deferred?`<button class="btn pri full" data-act="obinstall">Install the app</button>`:'')+`<button class="btn ghost full" data-act="obnext">Continue in the browser for now</button>`;
  }else if(k==='who'){
    m=`<div class="logo">${OBMARK}</div><h2>Who's training?</h2><p class="lead">Pick your name. Everything you log stays on this phone.</p><div class="list">`+
      S.profiles.map(p=>`<button class="opt ${p.id===S.active?'on':''}" data-act="obpick" data-id="${p.id}"><span class="av" style="background:${esc(p.color)}">${esc((p.name.trim()[0]||'?').toUpperCase())}</span><div class="sp">${esc(p.name)}<small>${esc(p.program.name)}</small></div></button>`).join('')+
      `<button class="btn ghost full" data-act="addperson">Someone else</button></div>`;
    f=`<button class="btn pri full" data-act="obnext">Continue</button>`;
  }else if(k==='notif'){
    const perm=Notification.permission;
    m=`<div class="logo">${OBMARK}</div><h2>Rest alerts</h2><p class="lead">Allow notifications so Athleta can tell you when your rest is over, even if you switch to another app.</p>`+
      (perm==='granted'?`<p class="ok">Notifications are on ✓</p>`:perm==='denied'?`<p class="lead" style="color:var(--bad)">Notifications are turned off for Athleta. To turn them on:</p>`+stepsHtml(settingsPath()):'')+(ob.msg?`<p class="lead">${ob.msg}</p>`:'');
    f=perm==='default'?`<button class="btn pri full" data-act="obnotif">Allow notifications</button><button class="btn ghost full" data-act="obnext">Not now</button>`:
      perm==='denied'?`<button class="btn pri full" data-act="obrecheck">I've turned them on</button><button class="btn ghost full" data-act="obnext">Skip for now</button>`:`<button class="btn pri full" data-act="obnext">Continue</button>`;
  }else if(k==='sound'){
    m=`<div class="logo">${OBMARK}</div><h2>Check the alarm</h2><p class="lead">Tap below. You should hear beeps and feel a buzz, the same as when your rest ends.</p>`+
      stepsHtml(isIOS?['Turn your <b>volume up</b> with the side buttons','If it stays quiet, flip the <b>silent switch</b> off (or turn off Silent Mode in Control Centre)','During workouts the screen stays on so the alarm can ring']:['Turn your <b>media volume</b> up with the side buttons','Check <b>Do Not Disturb</b> is off while you train','During workouts the screen stays on so the alarm can ring']);
    m+=`<button class="opt" data-act="pickalarm"><div class="sp">Alarm sound<small>${esc((SOUNDS[S.alarm]||SOUNDS.church).name)} · tap to choose another</small></div><span class="muted">›</span></button>`;
    f=`<button class="btn pri full" data-act="obtest">Play test alarm</button><button class="btn ghost full" data-act="obnext">${ob.tested?'I heard it, continue':'Skip'}</button>`;
  }else{
    m=`<div class="logo">${OBMARK}</div><h2>You're all set, ${esc(prof().name)}</h2><p class="lead">Every workout starts and ends with a prayer. Your weights and reps are remembered for next time, and you can change any exercise in the Program tab.</p><p class="lead" style="font-family:var(--prayer);font-style:italic;font-size:19px;color:var(--ink)">Omnia possum in eo qui me confortat.</p>`;
    f=`<button class="btn pri full" data-act="obdone">Amen. Let's train</button>`;
  }
  el.innerHTML=`<div class="obm">${m}</div><div class="obf">${dots}${f}</div>`;el.scrollTop=0;
}
function obOpen(){ob={step:0,msg:''};$('#ob').classList.add('on');obRender()}
Object.assign(A,{
  obnext(){ob.step++;ob.msg='';const L=obSteps();if(ob.step>=L.length){A.obdone();return}obRender()},
  obpick(el){S.active=el.dataset.id;save();resetPos();render(false);obRender()},
  obinstall(){if(!deferred)return;deferred.prompt();deferred.userChoice.finally(()=>{deferred=null;obRender()})},
  obnotif(){try{Notification.requestPermission().then(r=>{ob.msg=r==='granted'?'':r==='denied'?'':'You can turn this on later in Settings.';if(r==='granted'){try{navigator.serviceWorker&&navigator.serviceWorker.ready.then(g=>g.showNotification('Rest alerts are on',{body:'We\'ll tell you when it\'s time for your next set.',icon:'icons/icon-192.png',tag:'rest'}))}catch(e){}}obRender()})}catch(e){ob.step++;obRender()}},
  obrecheck(){obRender()},
  obtest(){testSound();ob.tested=true;obRender()},
  obdone(){S.welcomed=true;S.onboarded=true;save(true);$('#ob').classList.remove('on');render(false)},
  setup(){closeSheet();obOpen()},
});

/* ---------- boot ---------- */
resetPos();render(false);
if(!S.onboarded)obOpen();
if(mem)toast("Storage is off here, so data won't be kept");
if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
</script>
